name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

# Keep the current run alive so third-party partial caches can be saved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Build third-party dependencies (cached)
  # ─────────────────────────────────────────────────────────────────
  build-deps:
    name: Build Third-Party Dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout SethPub
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libgmp-dev uuid-dev \
            python3 python3-pip xxd \
            pkg-config git curl wget unzip
          sudo apt-get install -y --no-install-recommends libgmssl-dev || true
          # GmSSL may not be in apt; build from submodule if needed
          echo "System packages installed"

      - name: Generate third-party cache key
        id: third-party-key
        run: |
          DEPS_KEY=$(
            {
              git ls-files -s third_party clipy/liboqs
              sha256sum .gitmodules
            } | sha256sum | awk '{print $1}'
          )
          BUILD_KEY=$(
            sha256sum build_third.sh .github/workflows/ci.yml | sha256sum | awk '{print $1}'
          )
          echo "deps-key=$DEPS_KEY" >> "$GITHUB_OUTPUT"
          echo "key=$DEPS_KEY-$BUILD_KEY" >> "$GITHUB_OUTPUT"

      - name: Restore third-party cache
        id: cache-third-party
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/bin
            third_party/lib
            third_party/lib64
            third_party/include
            third_party/depends
            third_party/.build_third_complete
          key: third-party-v7-${{ runner.os }}-${{ steps.third-party-key.outputs.key }}-complete
          restore-keys: |
            third-party-v7-${{ runner.os }}-${{ steps.third-party-key.outputs.key }}-
            third-party-v7-${{ runner.os }}-${{ steps.third-party-key.outputs.deps-key }}-

      - name: Validate third-party cache
        id: third-party-cache-state
        run: |
          complete=false
          if [[ "${{ steps.cache-third-party.outputs.cache-hit }}" == "true" && -f third_party/.build_third_complete ]]; then
            complete=true
          else
            echo "Cache is partial, stale, or missing completion marker; build_third.sh will validate and resume missing outputs."
          fi
          if [[ "$complete" == "true" ]]; then
            echo "Third-party cache is complete; skipping rebuild."
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Build third-party libraries
        id: build-third-party
        if: steps.third-party-cache-state.outputs.complete != 'true'
        continue-on-error: true
        run: |
          bash build_third.sh
        timeout-minutes: 90

      - name: Validate final third-party outputs
        id: third-party-final-state
        if: always()
        run: |
          mkdir -p third_party/bin third_party/lib third_party/lib64 third_party/include third_party/depends
          complete=false
          if [[ -f third_party/.build_third_complete ]]; then
            complete=true
          else
            echo "Third-party build did not write completion marker; saving partial outputs for a resumable retry."
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Save complete third-party cache
        if: |
          always() &&
          steps.third-party-final-state.outputs.complete == 'true' &&
          steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/bin
            third_party/lib
            third_party/lib64
            third_party/include
            third_party/depends
            third_party/.build_third_complete
          key: third-party-v7-${{ runner.os }}-${{ steps.third-party-key.outputs.key }}-complete

      - name: Save resumable third-party cache
        if: |
          always() &&
          steps.third-party-final-state.outputs.complete != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/bin
            third_party/lib
            third_party/lib64
            third_party/include
            third_party/depends
            third_party/.build_third_complete
          key: third-party-v7-${{ runner.os }}-${{ steps.third-party-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail if third-party build failed
        if: |
          always() &&
          steps.third-party-cache-state.outputs.complete != 'true' &&
          (steps.build-third-party.outcome == 'failure' || steps.third-party-final-state.outputs.complete != 'true')
        run: |
          echo "Third-party build did not complete. Partial outputs were saved for the next run when possible."
          exit 1

      - name: Upload third-party artifacts
        if: steps.third-party-final-state.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: third-party-libs
          path: |
            third_party/bin
            third_party/lib
            third_party/lib64
            third_party/include
            third_party/depends
            third_party/.build_third_complete
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Build + Run C++ Unit Tests
  # ─────────────────────────────────────────────────────────────────
  unit-tests:
    name: C++ Unit Tests (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    needs: build-deps
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout SethPub
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libgmp-dev uuid-dev \
            python3 xxd pkg-config git

      - name: Download third-party artifacts
        uses: actions/download-artifact@v4
        with:
          name: third-party-libs
          path: third_party

      - name: Configure and build tests
        run: |
          bash build.sh test ${{ matrix.build_type }}
        env:
          CTEST_OUTPUT_ON_FAILURE: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.build_type }}
          path: |
            cbuild_${{ matrix.build_type }}/**/*.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Build seth binary (for integration tests)
  # ─────────────────────────────────────────────────────────────────
  build-seth:
    name: Build seth Binary
    runs-on: ubuntu-22.04
    needs: build-deps
    timeout-minutes: 60

    steps:
      - name: Checkout SethPub
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libgmp-dev uuid-dev \
            python3 xxd pkg-config git

      - name: Download third-party artifacts
        uses: actions/download-artifact@v4
        with:
          name: third-party-libs
          path: third_party

      - name: Build seth binary
        run: |
          bash build.sh seth Release

      - name: Upload seth binary
        uses: actions/upload-artifact@v4
        with:
          name: seth-binary
          path: cbuild_Release/seth
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # Job 4: Integration Tests (SethTests)
  # ─────────────────────────────────────────────────────────────────
  integration-tests:
    name: Remote Integration Tests (SethTests)
    runs-on: ubuntu-22.04
    needs: build-seth
    timeout-minutes: 120
    # Remote tests require repository secrets, so only run them on trusted pushes.
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/xl')) }}

    steps:
      - name: Install SSH tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass

      - name: Run remote SethTests
        env:
          XL_CICD_REMOTE_SERVER: ${{ secrets.XL_CICD_REMOTE_SERVER }}
        run: |
          set -euo pipefail

          : "${XL_CICD_REMOTE_SERVER:?Set XL_CICD_REMOTE_SERVER secret}"

          eval "$(
            python3 - <<'PY'
          import json
          import os
          import shlex
          import sys

          raw = os.environ["XL_CICD_REMOTE_SERVER"].strip()
          try:
              config = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f"XL_CICD_REMOTE_SERVER must be JSON: {exc}", file=sys.stderr)
              sys.exit(1)

          defaults = {
              "port": "2221",
              "user": "root",
              "workdir": "/root/seth",
              "node_host": "10.152.0.12",
              "tests_dir": "/root/SethTests",
              "python": "/root/tools/python3.10/bin/python3",
          }
          values = {**defaults, **config}
          for key in ("host", "password"):
              if not values.get(key):
                  print(f"XL_CICD_REMOTE_SERVER missing required field: {key}", file=sys.stderr)
                  sys.exit(1)

          names = {
              "host": "REMOTE_TEST_HOST",
              "port": "REMOTE_TEST_PORT",
              "user": "REMOTE_TEST_USER",
              "password": "REMOTE_TEST_PASSWORD",
              "workdir": "REMOTE_TEST_WORKDIR",
              "node_host": "REMOTE_TEST_NODE_HOST",
              "tests_dir": "REMOTE_SETH_TESTS_DIR",
              "python": "REMOTE_TEST_PYTHON",
          }
          for key, name in names.items():
              print(f"export {name}={shlex.quote(str(values[key]))}")
          PY
          )"

          echo "::add-mask::$REMOTE_TEST_PASSWORD"
          export SSHPASS="$REMOTE_TEST_PASSWORD"
          SSH_OPTS=(
            -p "$REMOTE_TEST_PORT"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
          )
          REMOTE="$REMOTE_TEST_USER@$REMOTE_TEST_HOST"

          sshpass -e ssh "${SSH_OPTS[@]}" "$REMOTE" 'bash -s' -- \
            "$REMOTE_TEST_WORKDIR" \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            "$REMOTE_TEST_NODE_HOST" \
            "$REMOTE_SETH_TESTS_DIR" \
            "$REMOTE_TEST_PYTHON" <<'REMOTE_SCRIPT'
          set -euo pipefail

          WORKDIR="$1"
          REF_NAME="$2"
          COMMIT_SHA="$3"
          NODE_HOST="$4"
          TESTS_DIR="$5"
          PYTHON_BIN="$6"

          echo "::group::Update SethPub"
          cd "$WORKDIR"
          git fetch origin "$REF_NAME"
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git stash push --include-untracked -m "ci-autostash-${COMMIT_SHA}" || true
          fi
          git checkout --detach "$COMMIT_SHA"
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
          git log -1 --oneline
          echo "::endgroup::"

          echo "::group::Start remote seth network"
          bash simple_remote.sh 4 "$NODE_HOST"
          echo "::endgroup::"

          echo "::group::Update SethTests"
          cd "$TESTS_DIR"
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git pull --ff-only
          fi
          echo "::endgroup::"

          echo "::group::Run SethTests"
          "$PYTHON_BIN" seth_test_runner.py --host "$NODE_HOST"
          echo "::endgroup::"
          REMOTE_SCRIPT

  # ─────────────────────────────────────────────────────────────────
  # Job 5: Summary
  # ─────────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-22.04
    needs: [build-deps, unit-tests, build-seth, integration-tests]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Third-party deps:  ${{ needs.build-deps.result }}"
          echo "Unit tests:        ${{ needs.unit-tests.result }}"
          echo "seth binary:       ${{ needs.build-seth.result }}"
          echo "Integration tests: ${{ needs.integration-tests.result }}"

          if [[ "${{ needs.build-deps.result }}" == "failure" || "${{ needs.build-deps.result }}" == "cancelled" ]]; then
            echo "Third-party dependency build failed"
            exit 1
          fi
          if [[ "${{ needs.unit-tests.result }}" == "failure" || "${{ needs.unit-tests.result }}" == "cancelled" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.build-seth.result }}" == "failure" || "${{ needs.build-seth.result }}" == "cancelled" ]]; then
            echo "seth binary build failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" == "failure" || "${{ needs.integration-tests.result }}" == "cancelled" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          echo "CI completed"
