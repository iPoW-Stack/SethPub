name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

# Keep the current run alive so third-party partial caches can be saved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Build third-party dependencies (cached)
  # ─────────────────────────────────────────────────────────────────
  build-deps:
    name: Build Third-Party Dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout ShardoraPub
        uses: actions/checkout@v4
        with:
          # Submodule sources are required for build_third.sh; shallow tree is enough.
          submodules: recursive
          fetch-depth: 1

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libgmp-dev uuid-dev \
            python3 python3-pip xxd \
            pkg-config git curl wget unzip \
            perl zlib1g-dev
          sudo apt-get install -y --no-install-recommends libgmssl-dev || true
          # GmSSL may not be in apt; build from submodule if needed
          echo "System packages installed"

      - name: Generate third-party cache key
        id: third-party-key
        run: |
          DEPS_KEY=$(
            {
              git ls-files -s third_party clipy/liboqs
              sha256sum .gitmodules
            } | sha256sum | awk '{print $1}'
          )
          BUILD_KEY=$(
            sha256sum build_third.sh | sha256sum | awk '{print $1}'
          )
          echo "deps-key=$DEPS_KEY" >> "$GITHUB_OUTPUT"
          echo "build-key=$BUILD_KEY" >> "$GITHUB_OUTPUT"
          echo "key=$DEPS_KEY-$BUILD_KEY" >> "$GITHUB_OUTPUT"

      - name: Restore third-party cache
        id: cache-third-party
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/bin
            third_party/lib
            third_party/lib64
            third_party/include
            third_party/depends
            third_party/.build_third_complete
          key: third-party-v8-${{ runner.os }}-${{ steps.third-party-key.outputs.key }}-complete
          restore-keys: |
            third-party-v8-${{ runner.os }}-${{ steps.third-party-key.outputs.key }}-
            third-party-v8-${{ runner.os }}-${{ steps.third-party-key.outputs.deps-key }}-

      - name: Validate complete third-party cache
        id: complete-third-party-cache-state
        run: |
          complete=false
          if [[ -f third_party/.build_third_complete ]]; then
            complete=true
          else
            echo "Complete third-party cache is missing; trying resumable build cache."
          fi
          if [[ "$complete" == "true" ]]; then
            echo "Third-party cache is complete; skipping rebuild."
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Restore resumable third-party cache
        id: cache-third-party-resumable
        if: steps.complete-third-party-cache-state.outputs.complete != 'true'
        uses: actions/cache/restore@v4
        with:
          # Resumable caches intentionally keep submodule source/build trees
          # plus .git/modules, so interrupted builds can continue from object
          # files and generated build directories on the next run.
          path: |
            third_party
            clipy/liboqs
            .git/modules/third_party
            .git/modules/clipy
          key: third-party-v8-${{ runner.os }}-${{ steps.third-party-key.outputs.deps-key }}-resumable-${{ steps.third-party-key.outputs.build-key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            third-party-v8-${{ runner.os }}-${{ steps.third-party-key.outputs.deps-key }}-resumable-

      - name: Validate third-party cache
        id: third-party-cache-state
        run: |
          complete=false
          if [[ -f third_party/.build_third_complete ]]; then
            complete=true
          else
            echo "Cache is partial, stale, or missing completion marker; build_third.sh will validate and resume missing outputs."
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Build third-party libraries
        id: build-third-party
        if: steps.third-party-cache-state.outputs.complete != 'true'
        run: |
          bash build_third.sh
        timeout-minutes: 120

      - name: Validate final third-party outputs
        id: third-party-final-state
        if: always()
        run: |
          mkdir -p third_party/bin third_party/lib third_party/lib64 third_party/include third_party/depends
          complete=false
          if [[ -f third_party/.build_third_complete ]]; then
            complete=true
          else
            echo "Third-party build did not write completion marker; saving partial outputs for a resumable retry."
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Save complete third-party cache
        if: |
          always() &&
          steps.third-party-final-state.outputs.complete == 'true' &&
          steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/bin
            third_party/lib
            third_party/lib64
            third_party/include
            third_party/depends
            third_party/.build_third_complete
          key: third-party-v8-${{ runner.os }}-${{ steps.third-party-key.outputs.key }}-complete

      - name: Save resumable third-party cache
        if: |
          always() &&
          steps.third-party-cache-state.outputs.complete != 'true' &&
          steps.third-party-final-state.outputs.complete != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party
            clipy/liboqs
            .git/modules/third_party
            .git/modules/clipy
          key: third-party-v8-${{ runner.os }}-${{ steps.third-party-key.outputs.deps-key }}-resumable-${{ steps.third-party-key.outputs.build-key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail if third-party build failed
        if: |
          always() &&
          steps.third-party-cache-state.outputs.complete != 'true' &&
          (steps.build-third-party.outcome == 'failure' || steps.third-party-final-state.outputs.complete != 'true')
        run: |
          echo "Third-party build did not complete. Partial outputs were saved for the next run when possible."
          exit 1

      - name: Upload third-party artifacts
        if: steps.third-party-final-state.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: third-party-libs
          path: |
            third_party/bin
            third_party/lib
            third_party/lib64
            third_party/include
            third_party/depends
            third_party/.build_third_complete
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Build + Run C++ Unit Tests
  # ─────────────────────────────────────────────────────────────────
  unit-tests:
    name: C++ Unit Tests (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    needs: build-deps
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout ShardoraPub
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libgmp-dev uuid-dev \
            python3 xxd pkg-config git

      - name: Download third-party artifacts
        uses: actions/download-artifact@v4
        with:
          name: third-party-libs
          path: third_party

      - name: Configure and build tests
        run: |
          bash build.sh test ${{ matrix.build_type }}
        env:
          CTEST_OUTPUT_ON_FAILURE: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.build_type }}
          path: |
            cbuild_${{ matrix.build_type }}/**/*.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Build shardora binary (for integration tests)
  # ─────────────────────────────────────────────────────────────────
  build-shardora:
    name: Build shardora Binary
    runs-on: ubuntu-22.04
    needs: build-deps
    timeout-minutes: 60

    steps:
      - name: Checkout ShardoraPub
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libgmp-dev uuid-dev \
            python3 xxd pkg-config git

      - name: Download third-party artifacts
        uses: actions/download-artifact@v4
        with:
          name: third-party-libs
          path: third_party

      - name: Build shardora binary
        run: |
          bash build.sh shardora Release

      - name: Upload shardora binary
        uses: actions/upload-artifact@v4
        with:
          name: shardora-binary
          path: cbuild_Release/shardora
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # Job 4: Integration Tests (ShardoraTests)
  # ─────────────────────────────────────────────────────────────────
  integration-tests:
    name: Remote Integration Tests (ShardoraTests)
    runs-on: ubuntu-22.04
    needs: []
    timeout-minutes: 120
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Install SSH tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass

      - name: Run ShardoraTests on remote host
        env:
          REMOTE_HOST: 35.197.170.240
          REMOTE_PORT: 2221
          REMOTE_USER: root
          DEPLOY_BRANCH: xl0424
          REMOTE_SSH_PRIVATE_KEY: ${{ secrets.XL_CICD_REMOTE_SSH_PRIVATE_KEY }}
          REMOTE_SSH_PASSWORD: ${{ secrets.XL_CICD_REMOTE_PASSWORD }}
        run: |
          set -euo pipefail

          SSH_OPTS=(
            -p "$REMOTE_PORT"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
          )

          if [[ -n "${REMOTE_SSH_PRIVATE_KEY:-}" ]]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$REMOTE_SSH_PRIVATE_KEY" > ~/.ssh/shardora_ci_key
            chmod 600 ~/.ssh/shardora_ci_key
            SSH_CMD=(ssh "${SSH_OPTS[@]}" -i ~/.ssh/shardora_ci_key "$REMOTE_USER@$REMOTE_HOST")
          else
            : "${REMOTE_SSH_PASSWORD:?Set XL_CICD_REMOTE_SSH_PRIVATE_KEY or XL_CICD_REMOTE_PASSWORD secret}"
            export SSHPASS="$REMOTE_SSH_PASSWORD"
            SSH_CMD=(sshpass -e ssh "${SSH_OPTS[@]}" "$REMOTE_USER@$REMOTE_HOST")
          fi

          "${SSH_CMD[@]}" 'bash -s' -- "$DEPLOY_BRANCH" "$GITHUB_SHA" <<'REMOTE_SCRIPT'
          set -euo pipefail

          DEPLOY_BRANCH="$1"
          COMMIT_SHA="$2"
          WORKDIR="/root/shardora"
          NODE_HOST="10.152.0.12"
          TESTS_DIR="/root/ShardoraTests"
          export SHARDORA_EXTRA_CMAKE_ARGS="-DSHARDORA_MOCK_VERIFY=ON -DSHARDORA_MOCK_SIGN=ON"
          export LD_LIBRARY_PATH="/root/tools/python3.10/lib:${LD_LIBRARY_PATH:-}"

          dump_remote_debug() {
            rc=$?
            if [[ "$rc" -eq 0 ]]; then
              return
            fi
            echo "::group::Remote debug after failure"
            echo "--- shardora processes ---"
            pgrep -af shardora || true
            echo "--- listening ports ---"
            ss -ltnp | grep -E '(:23001|:24009|:1200|:1300)' || true
            echo "--- recent shardora logs ---"
            find /root/shardoras -maxdepth 3 -type f \( -name '*.log' -o -name 'shardora.log' \) -print -exec tail -n 120 {} \; 2>/dev/null || true
            echo "::endgroup::"
            exit "$rc"
          }
          trap dump_remote_debug EXIT

          echo "::group::Update ShardoraPub"
          if [[ ! -d "$WORKDIR/.git" ]]; then
            rm -rf "$WORKDIR"
            git clone https://github.com/iPoW-Stack/ShardoraPub.git "$WORKDIR"
          fi
          cd "$WORKDIR"
          git fetch --force origin "$DEPLOY_BRANCH"
          if ! git diff --quiet || ! git diff --cached --quiet || [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            git stash push --include-untracked -m "ci-autostash-${COMMIT_SHA}" || true
          fi
          git checkout --force -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"
          git submodule sync --recursive || true
          git submodule update --init --recursive --force || true
          git log -1 --oneline
          echo "::endgroup::"

          echo "::group::Clear stale deployment package"
          rm -rf /root/shardora/pkgs /root/nodes /root/pkg /root/pkg.tar.gz /root/shardoras
          echo "::endgroup::"

          echo "::group::Start remote shardora network"
          bash simple_remote.sh 4 "$NODE_HOST"
          echo "::endgroup::"

          echo "::group::Wait for remote HTTP"
          for attempt in $(seq 1 60); do
            if /root/tools/python3.10/bin/python3 - "$NODE_HOST" <<'PY'
          import socket
          import sys
          host = sys.argv[1]
          try:
              with socket.create_connection((host, 23001), timeout=2):
                  sys.exit(0)
          except OSError:
              sys.exit(1)
          PY
            then
              echo "Remote HTTP port is ready: ${NODE_HOST}:23001"
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "Remote HTTP port did not become ready: ${NODE_HOST}:23001" >&2
              echo "--- shardora processes ---" >&2
              pgrep -af shardora || true
              echo "--- listening ports ---" >&2
              ss -ltnp | grep -E '(:23001|:24009|:1200|:1300)' || true
              echo "--- recent logs ---" >&2
              find /root/shardoras -maxdepth 3 -type f \( -name '*.log' -o -name 'shardora.log' \) -print -exec tail -n 80 {} \; 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done
          echo "::endgroup::"

          echo "::group::Update ShardoraTests"
          if [[ ! -d "$TESTS_DIR/.git" ]]; then
            rm -rf "$TESTS_DIR"
            git clone https://github.com/iPoW-Stack/ShardoraTests.git "$TESTS_DIR"
          fi
          cd "$TESTS_DIR"
          if ! git diff --quiet || ! git diff --cached --quiet || [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            git stash push --include-untracked -m "ci-shardoratests-autostash-${COMMIT_SHA}" || true
          fi
          git pull --ff-only || true
          echo "::endgroup::"

          echo "::group::Wait for chain receipt readiness"
          /root/tools/python3.10/bin/python3 - "$NODE_HOST" /root/shardora/init_accounts3 <<'PY'
          import sys
          import time

          host = sys.argv[1]
          keys_file = sys.argv[2]
          from shardora_sdk import ShardoraClient, StepType

          keys = []
          with open(keys_file, "r", encoding="utf-8") as fp:
              for line in fp:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  keys.append(line.split()[0])
                  if len(keys) >= 2:
                      break

          if len(keys) < 2:
              raise SystemExit(f"need at least two private keys in {keys_file}")

          client = ShardoraClient(host, 23001)
          dst = client.get_address(keys[1])
          deadline = time.time() + 300
          attempt = 0
          while time.time() < deadline:
              attempt += 1
              try:
                  tx_hash = client.send_transaction_auto(keys[0], dst, StepType.kNormalFrom, amount=1)
                  receipt = client.wait_for_receipt(tx_hash, timeout=180)
                  if receipt and receipt.get("status") == 0:
                      print(f"chain receipt ready after attempt {attempt}: {tx_hash}")
                      sys.exit(0)
                  print(f"chain receipt not ready on attempt {attempt}: {receipt}")
              except Exception as exc:
                  print(f"chain readiness attempt {attempt} failed: {exc}")
              time.sleep(min(5 + attempt, 15))

          raise SystemExit("chain did not produce a successful smoke-test receipt in time")
          PY
          # Give the freshly-started consensus network a short quiet window
          # before the full concurrent test fan-out.
          sleep 10
          echo "::endgroup::"

          echo "::group::Run ShardoraTests"
          /root/tools/python3.10/bin/python3 shardora_test_runner.py --host 10.152.0.12 --private-keys /root/shardora/init_accounts3 --concurrent --max-workers 16
          echo "::endgroup::"
          REMOTE_SCRIPT

  # ─────────────────────────────────────────────────────────────────
  # Job 5: Summary
  # ─────────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-22.04
    needs: [build-deps, unit-tests, build-shardora, integration-tests]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Third-party deps:  ${{ needs.build-deps.result }}"
          echo "Unit tests:        ${{ needs.unit-tests.result }}"
          echo "shardora binary:       ${{ needs.build-shardora.result }}"
          echo "Integration tests: ${{ needs.integration-tests.result }}"

          if [[ "${{ needs.build-deps.result }}" == "failure" || "${{ needs.build-deps.result }}" == "cancelled" ]]; then
            echo "Third-party dependency build failed"
            exit 1
          fi
          if [[ "${{ needs.unit-tests.result }}" == "failure" || "${{ needs.unit-tests.result }}" == "cancelled" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.build-shardora.result }}" == "failure" || "${{ needs.build-shardora.result }}" == "cancelled" ]]; then
            echo "shardora binary build failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" == "failure" || "${{ needs.integration-tests.result }}" == "cancelled" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          echo "CI completed"
