name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

# Cancel in-progress runs for the same branch/PR to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Build third-party dependencies (cached)
  # ─────────────────────────────────────────────────────────────────
  build-deps:
    name: Build Third-Party Dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout SethPub
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libgmp-dev uuid-dev \
            python3 python3-pip xxd \
            pkg-config git curl wget unzip
          sudo apt-get install -y --no-install-recommends libgmssl-dev || true
          # GmSSL may not be in apt; build from submodule if needed
          echo "System packages installed"

      - name: Generate third-party cache key
        id: third-party-key
        run: |
          DEPS_KEY=$(
            {
              git ls-files -s third_party clipy/liboqs
              sha256sum .gitmodules
            } | sha256sum | awk '{print $1}'
          )
          BUILD_KEY=$(
            sha256sum build_third.sh .github/workflows/ci.yml | sha256sum | awk '{print $1}'
          )
          echo "deps-key=$DEPS_KEY" >> "$GITHUB_OUTPUT"
          echo "key=$DEPS_KEY-$BUILD_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache third-party build
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: |
            third_party/bin
            third_party/lib
            third_party/lib64
            third_party/include
            third_party/depends
          key: third-party-v2-${{ runner.os }}-${{ steps.third-party-key.outputs.key }}
          restore-keys: |
            third-party-v2-${{ runner.os }}-${{ steps.third-party-key.outputs.deps-key }}-

      - name: Build third-party libraries
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        run: |
          bash build_third.sh
        timeout-minutes: 90

      - name: Upload third-party artifacts
        uses: actions/upload-artifact@v4
        with:
          name: third-party-libs
          path: |
            third_party/bin
            third_party/lib
            third_party/lib64
            third_party/include
            third_party/depends
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Build + Run C++ Unit Tests
  # ─────────────────────────────────────────────────────────────────
  unit-tests:
    name: C++ Unit Tests (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    needs: build-deps
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout SethPub
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libgmp-dev uuid-dev \
            python3 xxd pkg-config git

      - name: Download third-party artifacts
        uses: actions/download-artifact@v4
        with:
          name: third-party-libs
          path: third_party

      - name: Configure and build tests
        run: |
          bash build.sh test ${{ matrix.build_type }}
        env:
          CTEST_OUTPUT_ON_FAILURE: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.build_type }}
          path: |
            cbuild_${{ matrix.build_type }}/**/*.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Build seth binary (for integration tests)
  # ─────────────────────────────────────────────────────────────────
  build-seth:
    name: Build seth Binary
    runs-on: ubuntu-22.04
    needs: build-deps
    timeout-minutes: 60

    steps:
      - name: Checkout SethPub
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libgmp-dev uuid-dev \
            python3 xxd pkg-config git

      - name: Download third-party artifacts
        uses: actions/download-artifact@v4
        with:
          name: third-party-libs
          path: third_party

      - name: Build seth binary
        run: |
          bash build.sh seth Release

      - name: Upload seth binary
        uses: actions/upload-artifact@v4
        with:
          name: seth-binary
          path: cbuild_Release/seth
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # Job 4: Integration Tests (SethTests)
  # ─────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (SethTests)
    runs-on: ubuntu-22.04
    needs: build-seth
    timeout-minutes: 30
    # Only run on main/xl* branches and PRs targeting them
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/xl') ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout SethPub
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Checkout SethTests
        uses: actions/checkout@v4
        with:
          repository: iPoW-Stack/SethTests
          path: SethTests
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          # Install SethTests requirements if present
          if [ -f SethTests/requirements.txt ]; then
            pip3 install -r SethTests/requirements.txt
          fi
          # Install clipy dependencies
          pip3 install \
            requests eth-account ecdsa py-solc-x \
            websocket-client gmssl || true

      - name: Download seth binary
        uses: actions/download-artifact@v4
        with:
          name: seth-binary
          path: cbuild_Release

      - name: Make seth executable
        run: chmod +x cbuild_Release/seth

      - name: Start local seth network
        run: |
          # Generate node configs for a minimal local network
          python3 gen_nodes_conf.py 3 127.0.0.1 2>/dev/null || \
          python3 xl_gen_nodes_conf.py 3 127.0.0.1 2>/dev/null || \
          echo "Config generation skipped"

          # Start seth nodes in background (if config exists)
          if ls seths_local/*/conf/sethhain.conf 2>/dev/null | head -1; then
            bash xl_local.sh start 2>/dev/null || \
            echo "Local network start skipped (no xl_local.sh)"
          fi
          sleep 5

      - name: Run SethTests test suite
        run: |
          cd SethTests
          # Run all test files found in the repo
          if [ -f run_tests.sh ]; then
            bash run_tests.sh
          elif [ -f pytest.ini ] || [ -f setup.cfg ] || ls test_*.py 2>/dev/null; then
            python3 -m pytest -v --tb=short --timeout=120 2>&1 | tee test_output.txt
          elif ls *.py 2>/dev/null | grep -q test; then
            for f in test_*.py; do
              echo "=== Running $f ==="
              python3 "$f" || echo "FAILED: $f"
            done
          else
            echo "No test runner found in SethTests, listing contents:"
            ls -la
          fi

      - name: Stop local seth network
        if: always()
        run: |
          pkill -f "seth " 2>/dev/null || true
          echo "Network stopped"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            SethTests/test_output.txt
            SethTests/*.log
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # Job 5: Summary
  # ─────────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-22.04
    needs: [build-deps, unit-tests, build-seth, integration-tests]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Third-party deps:  ${{ needs.build-deps.result }}"
          echo "Unit tests:        ${{ needs.unit-tests.result }}"
          echo "seth binary:       ${{ needs.build-seth.result }}"
          echo "Integration tests: ${{ needs.integration-tests.result }}"

          if [[ "${{ needs.build-deps.result }}" == "failure" || "${{ needs.build-deps.result }}" == "cancelled" ]]; then
            echo "Third-party dependency build failed"
            exit 1
          fi
          if [[ "${{ needs.unit-tests.result }}" == "failure" || "${{ needs.unit-tests.result }}" == "cancelled" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.build-seth.result }}" == "failure" || "${{ needs.build-seth.result }}" == "cancelled" ]]; then
            echo "seth binary build failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" == "failure" || "${{ needs.integration-tests.result }}" == "cancelled" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          echo "CI completed"
