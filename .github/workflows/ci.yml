name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

# Cancel in-progress runs for the same branch/PR to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Build third-party dependencies (cached)
  # ─────────────────────────────────────────────────────────────────
  build-deps:
    name: Build Third-Party Dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout SethPub
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libgmp-dev uuid-dev \
            python3 python3-pip xxd \
            pkg-config git curl wget unzip
          sudo apt-get install -y --no-install-recommends libgmssl-dev || true
          # GmSSL may not be in apt; build from submodule if needed
          echo "System packages installed"

      - name: Generate third-party cache key
        id: third-party-key
        run: |
          DEPS_KEY=$(
            {
              git ls-files -s third_party clipy/liboqs
              sha256sum .gitmodules
            } | sha256sum | awk '{print $1}'
          )
          BUILD_KEY=$(
            sha256sum build_third.sh .github/workflows/ci.yml | sha256sum | awk '{print $1}'
          )
          echo "deps-key=$DEPS_KEY" >> "$GITHUB_OUTPUT"
          echo "key=$DEPS_KEY-$BUILD_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache third-party build
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: |
            third_party/bin
            third_party/lib
            third_party/lib64
            third_party/include
            third_party/depends
          key: third-party-v5-${{ runner.os }}-${{ steps.third-party-key.outputs.key }}
          restore-keys: |
            third-party-v5-${{ runner.os }}-${{ steps.third-party-key.outputs.deps-key }}-

      - name: Validate third-party cache
        id: third-party-cache-state
        run: |
          REQUIRED_FILES=(
            third_party/include/evmc/evmc.hpp
            third_party/include/libbls/tools/utils.h
            third_party/include/libff/algebra/curves/alt_bn128/alt_bn128_g1.hpp
            third_party/include/pbc/pbc.h
            third_party/include/cpppbc/PBC.h
            third_party/include/nlohmann/json.hpp
            third_party/include/libusockets.h
            third_party/lib/libdkgbls.a
            third_party/lib/libff.a
          )

          complete=true
          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -e "$file" ]]; then
              echo "Cache missing required file: $file"
              complete=false
            fi
          done
          if [[ "$complete" == "true" ]]; then
            echo "Third-party cache is complete; skipping rebuild."
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Build third-party libraries
        if: steps.third-party-cache-state.outputs.complete != 'true'
        run: |
          bash build_third.sh
        timeout-minutes: 90

      - name: Upload third-party artifacts
        uses: actions/upload-artifact@v4
        with:
          name: third-party-libs
          path: |
            third_party/bin
            third_party/lib
            third_party/lib64
            third_party/include
            third_party/depends
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Build + Run C++ Unit Tests
  # ─────────────────────────────────────────────────────────────────
  unit-tests:
    name: C++ Unit Tests (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    needs: build-deps
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout SethPub
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libgmp-dev uuid-dev \
            python3 xxd pkg-config git

      - name: Download third-party artifacts
        uses: actions/download-artifact@v4
        with:
          name: third-party-libs
          path: third_party

      - name: Configure and build tests
        run: |
          bash build.sh test ${{ matrix.build_type }}
        env:
          CTEST_OUTPUT_ON_FAILURE: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.build_type }}
          path: |
            cbuild_${{ matrix.build_type }}/**/*.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Build seth binary (for integration tests)
  # ─────────────────────────────────────────────────────────────────
  build-seth:
    name: Build seth Binary
    runs-on: ubuntu-22.04
    needs: build-deps
    timeout-minutes: 60

    steps:
      - name: Checkout SethPub
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libgmp-dev uuid-dev \
            python3 xxd pkg-config git

      - name: Download third-party artifacts
        uses: actions/download-artifact@v4
        with:
          name: third-party-libs
          path: third_party

      - name: Build seth binary
        run: |
          bash build.sh seth Release

      - name: Upload seth binary
        uses: actions/upload-artifact@v4
        with:
          name: seth-binary
          path: cbuild_Release/seth
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # Job 4: Integration Tests (SethTests)
  # ─────────────────────────────────────────────────────────────────
  integration-tests:
    name: Remote Integration Tests (SethTests)
    runs-on: ubuntu-22.04
    needs: build-seth
    timeout-minutes: 120
    # Remote tests require repository secrets, so only run them on trusted pushes.
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/xl')) }}

    steps:
      - name: Install SSH tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass

      - name: Run remote SethTests
        env:
          REMOTE_TEST_HOST: ${{ secrets.REMOTE_TEST_HOST }}
          REMOTE_TEST_PORT: ${{ secrets.REMOTE_TEST_PORT }}
          REMOTE_TEST_USER: ${{ secrets.REMOTE_TEST_USER }}
          REMOTE_TEST_PASSWORD: ${{ secrets.REMOTE_TEST_PASSWORD }}
          REMOTE_TEST_WORKDIR: ${{ secrets.REMOTE_TEST_WORKDIR }}
          REMOTE_TEST_NODE_HOST: ${{ secrets.REMOTE_TEST_NODE_HOST }}
          REMOTE_SETH_TESTS_DIR: ${{ secrets.REMOTE_SETH_TESTS_DIR }}
          REMOTE_TEST_PYTHON: ${{ secrets.REMOTE_TEST_PYTHON }}
        run: |
          set -euo pipefail

          : "${REMOTE_TEST_HOST:?Set REMOTE_TEST_HOST secret}"
          : "${REMOTE_TEST_PASSWORD:?Set REMOTE_TEST_PASSWORD secret}"

          REMOTE_TEST_PORT="${REMOTE_TEST_PORT:-2221}"
          REMOTE_TEST_USER="${REMOTE_TEST_USER:-root}"
          REMOTE_TEST_WORKDIR="${REMOTE_TEST_WORKDIR:-/root/seth}"
          REMOTE_TEST_NODE_HOST="${REMOTE_TEST_NODE_HOST:-10.152.0.12}"
          REMOTE_SETH_TESTS_DIR="${REMOTE_SETH_TESTS_DIR:-/root/SethTests}"
          REMOTE_TEST_PYTHON="${REMOTE_TEST_PYTHON:-/root/tools/python3.10/bin/python3}"

          export SSHPASS="$REMOTE_TEST_PASSWORD"
          SSH_OPTS=(
            -p "$REMOTE_TEST_PORT"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
          )
          REMOTE="$REMOTE_TEST_USER@$REMOTE_TEST_HOST"

          sshpass -e ssh "${SSH_OPTS[@]}" "$REMOTE" 'bash -s' -- \
            "$REMOTE_TEST_WORKDIR" \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            "$REMOTE_TEST_NODE_HOST" \
            "$REMOTE_SETH_TESTS_DIR" \
            "$REMOTE_TEST_PYTHON" <<'REMOTE_SCRIPT'
          set -euo pipefail

          WORKDIR="$1"
          REF_NAME="$2"
          COMMIT_SHA="$3"
          NODE_HOST="$4"
          TESTS_DIR="$5"
          PYTHON_BIN="$6"

          echo "::group::Update SethPub"
          cd "$WORKDIR"
          git fetch origin "$REF_NAME"
          git checkout --detach "$COMMIT_SHA"
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
          git log -1 --oneline
          echo "::endgroup::"

          echo "::group::Start remote seth network"
          bash simple_remote.sh 4 "$NODE_HOST"
          echo "::endgroup::"

          echo "::group::Update SethTests"
          cd "$TESTS_DIR"
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git pull --ff-only
          fi
          echo "::endgroup::"

          echo "::group::Run SethTests"
          "$PYTHON_BIN" seth_test_runner.py --host "$NODE_HOST"
          echo "::endgroup::"
          REMOTE_SCRIPT

  # ─────────────────────────────────────────────────────────────────
  # Job 5: Summary
  # ─────────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-22.04
    needs: [build-deps, unit-tests, build-seth, integration-tests]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Third-party deps:  ${{ needs.build-deps.result }}"
          echo "Unit tests:        ${{ needs.unit-tests.result }}"
          echo "seth binary:       ${{ needs.build-seth.result }}"
          echo "Integration tests: ${{ needs.integration-tests.result }}"

          if [[ "${{ needs.build-deps.result }}" == "failure" || "${{ needs.build-deps.result }}" == "cancelled" ]]; then
            echo "Third-party dependency build failed"
            exit 1
          fi
          if [[ "${{ needs.unit-tests.result }}" == "failure" || "${{ needs.unit-tests.result }}" == "cancelled" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.build-seth.result }}" == "failure" || "${{ needs.build-seth.result }}" == "cancelled" ]]; then
            echo "seth binary build failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" == "failure" || "${{ needs.integration-tests.result }}" == "cancelled" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          echo "CI completed"
